name: photomax
description: "A custom gallery app for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Media Access
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.1.1
  photo_view: ^0.15.0
  video_player: ^2.9.2

  # Storage
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.1.2
  chewie: ^1.13.1
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true