name: photomax
description: "A custom gallery app for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # Media Access
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.1.1
  photo_view: ^0.15.0
  video_player: ^2.9.2
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  
  # Database (Changed to Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true